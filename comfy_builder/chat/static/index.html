<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Chat</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #e0e0e0;
    --text-dim: #888;
    --border: #2a2a4a;
    --code-bg: #0d1117;
    --success: #4caf50;
    --warning: #ff9800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  #status-dot.online { background: var(--success); }
  #status-dot.offline { background: var(--accent); }
  #status-text { font-size: 12px; color: var(--text-dim); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--surface2);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant .content p { margin-bottom: 8px; }
  .msg.assistant .content p:last-child { margin-bottom: 0; }
  .msg.assistant .content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg.assistant .content pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg.assistant .content pre code {
    background: none;
    padding: 0;
  }
  .msg.assistant .content strong { color: #fff; }

  .tool-block {
    margin: 8px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .tool-header {
    background: var(--code-bg);
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    user-select: none;
  }
  .tool-header:hover { background: var(--border); }
  .tool-header .arrow { transition: transform 0.2s; }
  .tool-header .arrow.open { transform: rotate(90deg); }
  .tool-name { color: var(--accent); font-weight: 600; }
  .tool-status { margin-left: auto; font-size: 11px; }
  .tool-body {
    display: none;
    padding: 8px 12px;
    background: var(--code-bg);
    border-top: 1px solid var(--border);
    font-size: 12px;
    max-height: 300px;
    overflow-y: auto;
  }
  .tool-body.open { display: block; }
  .tool-body pre { white-space: pre-wrap; word-break: break-all; }

  .output-image {
    max-width: 100%;
    max-height: 400px;
    border-radius: 8px;
    margin: 8px 0;
    cursor: pointer;
  }
  .output-image:hover { opacity: 0.9; }

  #input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  .input-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #input-area textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
  }
  #input-area textarea:focus { border-color: var(--accent); }

  .ref-image-area {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ref-image-area .ref-preview {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .ref-image-area .ref-filename { font-size: 12px; color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .ref-image-area .ref-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .ref-image-area .ref-clear:hover { border-color: var(--accent); color: var(--accent); }
  .ref-upload-btn {
    background: var(--surface2);
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .ref-upload-btn:hover { border-color: var(--accent); color: var(--text); }
  #ref-input { display: none; }

  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #send-btn:hover { opacity: 0.9; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .typing {
    align-self: flex-start;
    color: var(--text-dim);
    font-style: italic;
    padding: 8px 16px;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>ComfyUI Chat</h1>
  <div id="status-dot"></div>
  <span id="status-text">Checking...</span>
</header>

<div id="messages"></div>

<div id="input-area">
  <div class="input-column">
    <div class="ref-image-area" id="ref-area" style="display: none;">
      <img class="ref-preview" id="ref-preview" alt="Reference" />
      <span class="ref-filename" id="ref-filename"></span>
      <button type="button" class="ref-clear" id="ref-clear">Remove</button>
    </div>
    <div class="ref-image-area">
      <label class="ref-upload-btn" for="ref-input">Attach reference image</label>
      <input type="file" id="ref-input" accept=".png,.jpg,.jpeg,.webp,.gif" />
    </div>
    <textarea id="input" placeholder="Ask me to generate images, modify workflows, check status..." rows="1"></textarea>
  </div>
  <button id="send-btn">Send</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const refInput = document.getElementById('ref-input');
const refArea = document.getElementById('ref-area');
const refPreview = document.getElementById('ref-preview');
const refFilename = document.getElementById('ref-filename');
const refClearBtn = document.getElementById('ref-clear');

let chatHistory = [];
let busy = false;
let referenceImageFilename = null;  // set after upload

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Send on Enter (Shift+Enter for newline)
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// Reference image: on file select, upload and show preview (long timeout: server may be busy with chat)
refInput.addEventListener('change', async () => {
  const file = refInput.files && refInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  const controller = new AbortController();
  let timeoutId = setTimeout(() => controller.abort(), 90000);
  try {
    const resp = await fetch('/api/upload-reference', { method: 'POST', body: formData, signal: controller.signal });
    clearTimeout(timeoutId);
    let data;
    try {
      data = await resp.json();
    } catch (_) {
      appendMessage('assistant', `Upload failed: Server returned ${resp.status}. Is the panel running at http://localhost:8085?`);
      refInput.value = '';
      return;
    }
    if (data.error) {
      appendMessage('assistant', `Upload failed: ${data.error}`);
      refInput.value = '';
      return;
    }
    if (!data.filename) {
      appendMessage('assistant', 'Upload failed: No filename in response.');
      refInput.value = '';
      return;
    }
    referenceImageFilename = data.filename;
    refPreview.src = URL.createObjectURL(file);
    refFilename.textContent = data.filename;
    refArea.style.display = 'flex';
  } catch (e) {
    clearTimeout(timeoutId);
    const msg = e.message || String(e);
    const isAbort = e.name === 'AbortError';
    if (isAbort || msg === 'Failed to fetch' || msg.includes('NetworkError') || msg.includes('Load failed')) {
      appendMessage('assistant', isAbort
        ? 'Upload failed: Request timed out (90s). The server may be busy with a chat — try again in a few seconds.'
        : 'Upload failed: Could not reach the panel server. Make sure it is running (python -m comfy_builder chat) and you are on http://localhost:8085.');
    } else {
      appendMessage('assistant', `Upload failed: ${msg}`);
    }
  }
  refInput.value = '';
});

refClearBtn.addEventListener('click', () => {
  if (refPreview.src) URL.revokeObjectURL(refPreview.src);
  refPreview.removeAttribute('src');
  refFilename.textContent = '';
  refArea.style.display = 'none';
  referenceImageFilename = null;
});

// Check status on load
checkStatus();

async function checkStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    const ollamaOk = data.ollama?.online;
    const comfyOk = data.comfyui?.online;

    if (ollamaOk && comfyOk) {
      statusDot.className = 'online';
      statusText.textContent = `Model: ${data.model} | ComfyUI: online`;
    } else {
      statusDot.className = 'offline';
      const parts = [];
      if (!ollamaOk) parts.push('Ollama offline');
      if (!comfyOk) parts.push('ComfyUI offline — start ComfyUI at http://127.0.0.1:8000 for image generation');
      statusText.textContent = parts.length ? parts.join(' | ') : 'Checking...';
    }
  } catch {
    statusDot.className = 'offline';
    statusText.textContent = 'Server unreachable';
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Add user message
  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  const refForRequest = referenceImageFilename;
  if (referenceImageFilename) {
    refClearBtn.click();
  }

  // Show typing indicator (LLM + tool calls can take 30–90s; watch the panel terminal for "Tool call: ...")
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = 'Thinking… (check the panel terminal for tool calls; ComfyUI queue updates when run_workflow runs)';
  messagesEl.appendChild(typingEl);
  scrollBottom();

  try {
    const payload = { message: text, history: chatHistory.slice(0, -1) };
    if (refForRequest) payload.reference_image = refForRequest;
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();

    typingEl.remove();

    // Render tool results + assistant message
    appendAssistantMessage(data.content || '', data.tool_results || []);
    chatHistory.push({ role: 'assistant', content: data.content || '' });

  } catch (err) {
    typingEl.remove();
    appendMessage('assistant', `Error: ${err.message}`);
  }

  busy = false;
  sendBtn.disabled = false;
  inputEl.focus();
  checkStatus();
}

function appendMessage(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollBottom();
}

function appendAssistantMessage(content, toolResults) {
  const el = document.createElement('div');
  el.className = 'msg assistant';

  // Tool results first
  for (const tr of toolResults) {
    el.appendChild(renderToolBlock(tr));
  }

  // Content with basic markdown rendering
  if (content) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    contentDiv.innerHTML = renderMarkdown(content);
    el.appendChild(contentDiv);
  }

  // Check for image outputs in tool results
  for (const tr of toolResults) {
    const outputs = tr.result?.outputs || [];
    for (const out of outputs) {
      if (out.type === 'image' && out.file) {
        const img = document.createElement('img');
        img.className = 'output-image';
        // Extract filename from full path for the image API
        const parts = out.file.replace(/\\/g, '/').split('/');
        const filename = parts[parts.length - 1];
        img.src = `/api/image/${filename}`;
        img.alt = 'Generated image';
        img.title = 'Click to open full size';
        img.onclick = () => window.open(img.src, '_blank');
        el.appendChild(img);
      }
    }
  }

  messagesEl.appendChild(el);
  scrollBottom();
}

function renderToolBlock(tr) {
  const block = document.createElement('div');
  block.className = 'tool-block';

  const header = document.createElement('div');
  header.className = 'tool-header';

  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.textContent = '\u25B6';

  const name = document.createElement('span');
  name.className = 'tool-name';
  name.textContent = tr.tool;

  const args = document.createElement('span');
  const argStr = Object.entries(tr.arguments || {})
    .map(([k, v]) => `${k}=${typeof v === 'string' ? '"' + v.slice(0, 30) + '"' : v}`)
    .join(', ');
  args.textContent = argStr ? `(${argStr})` : '';
  args.style.color = 'var(--text-dim)';

  const status = document.createElement('span');
  status.className = 'tool-status';
  const isOk = tr.result?.status !== 'error';
  status.textContent = isOk ? 'OK' : 'Error';
  status.style.color = isOk ? 'var(--success)' : 'var(--accent)';

  header.appendChild(arrow);
  header.appendChild(name);
  header.appendChild(args);
  header.appendChild(status);

  const body = document.createElement('div');
  body.className = 'tool-body';
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(tr.result, null, 2);
  body.appendChild(pre);

  header.addEventListener('click', () => {
    arrow.classList.toggle('open');
    body.classList.toggle('open');
  });

  block.appendChild(header);
  block.appendChild(body);
  return block;
}

function renderMarkdown(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Line breaks to paragraphs
  text = text.split('\n\n').map(p => `<p>${p}</p>`).join('');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>
</body>
</html>
