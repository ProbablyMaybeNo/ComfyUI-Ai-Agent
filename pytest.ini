[pytest]
# Run from project root: pytest comfy_builder/tests/
testpaths = comfy_builder/tests
python_files = test_*.py
python_functions = test_*
# Markers: unit tests (default), live = needs running ComfyUI server
markers =
    live: tests that require a running ComfyUI server (manual/integration). Skip if server is down.
addopts = -v --tb=short
